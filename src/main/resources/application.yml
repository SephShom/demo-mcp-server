spring:
  application:
    name: demo-mcp-server

  ai:
    mcp:
      server:
        name: demo-mcp-server
        version: 1.0.0
        type: SYNC
        # Streamable-HTTP transport, exposed on http://localhost:8080/mcp
        # Use "SSE" instead for the legacy SSE transport, see application-sse.yml
        protocol: STREAMABLE
        instructions: >
          Demo MCP server backed by mocked data. It exposes tools over a user directory,
          a product catalogue and an aggregated dashboard. All data is in-memory and the
          reads are safe to call any time; addProduct is the only tool that changes state
          and its changes are lost when the server restarts.
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

server:
  port: 8080

logging:
  level:
    com.example.demo: INFO
    org.springframework.ai.mcp: INFO
